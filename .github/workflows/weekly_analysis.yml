name: 週次分析・ダッシュボード更新

on:
  schedule:
    # 毎週日曜21:00 JST = 12:00 UTC
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 自アカウント統計を自動取得（Nitter）
        run: python scripts/fetch_own_stats.py

      - name: 週次パフォーマンス分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/run_pipeline.py weekly

      - name: HTMLダッシュボードを生成
        run: python scripts/generate_dashboard.py

      - name: 分析結果・ダッシュボードをコミット・プッシュ
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/index.html data/analytics_insights.json data/tone_guide.json
          git diff --staged --quiet || git commit -m "週次分析・ダッシュボード更新 $(date +'%Y/%m/%d')"
          git push
